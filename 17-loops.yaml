---
- name: install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - nginx
    - mysql

  tasks:
  - name: install packages
    package:
      name: "{{ item }}"
      state: present
    loop: "{{ packages }}"

  - name: start service
    service:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop: "{{ packages }}"
  