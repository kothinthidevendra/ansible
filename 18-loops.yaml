---
- name: package management
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'absent' }
    - { name: 'mysql', state: 'present' }
    - { name: 'git', state: 'present' }

  tasks:
  - name: package management
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"