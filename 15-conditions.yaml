---
- name: print os distro
  hosts: localhost
  connection: local
  tasks:
  - name: print the os distro as Redhat
    debug:
      msg: " OS distro is redhat "
    when: ansible_facts.os_family == "RedHat"

  - name: print the os distro as Ubuntu
    debug:
      msg: " OS distro is ubuntu "
    when: ansible_facts.os_family == "Debian"