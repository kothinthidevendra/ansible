- name: demo on filter
  hosts: local
  connection: local
  vars:
    topics: "Linux, Ansible, Cloud, Terraform"
  tasks:
  - name: print the name
    debug:
      msg: "Hi, {{ person_name | default('Ramesh') }}"

  - name: print variables  
    debug:
      msg: "Hello, {{ topics }}"
  
  - name: convert to string  
    debug:
      msg: "Topics are: {{ topics | split(',') }}"