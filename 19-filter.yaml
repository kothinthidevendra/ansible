- name: demo on filter
  hosts: local
  connection: local
  vars:
    topics: "Linux, Ansible, Cloud, Terraform"
    names:
    - Sai
    - Kumar
    - Swamy
  tasks:
  - name: print the name
    debug:
      msg: "Hi, {{ person_name | default('Ramesh') }}"

  - name: print variables  
    debug:
      msg: "Hello, {{ topics }}"
  
  - name: convert string to list 
    debug:
      msg: "Topics are: {{ topics | split(',') | trim }}"
  
  - name: convert list to string
    debug:
      msg: "Full name: {{ names | join(' ') }}"