---
- name: demo condition number is even or odd
  hosts: local
  connection: local
  vars:
    given_number: 10
  tasks:
  - name: number is even
    debug:
      msg: " Given number {{ given_number }} is even "
    when: given_number % 2 == 0 # expression

  - name: number is odd
    debug:
      msg: " Given number {{ given_number }} is odd "
    when: given_number % 2 != 0 # expression
    
     